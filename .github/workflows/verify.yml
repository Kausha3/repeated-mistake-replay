name: Verify record inspector

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Rebuild the standalone page
        run: python build_site.py
      - name: Run Python, parity and browser-state regressions
        run: python -m unittest -v
      - name: Verify generated page matches committed bytes
        run: git diff --exit-code -- docs/index.html
      - name: Exercise the bundled CLI
        run: python replay.py --output "$RUNNER_TEMP/record-inspector-report"
